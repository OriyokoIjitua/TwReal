  <script>


// --- NUEVO: gestión de datos por temporada desde un solo archivo ---
let jugadores = [], entrenadores = [], salidas = [], sanseJugadores = [], sanseEntrenadores = [];
let currentTeam = 'real'; // 'real' o 'sanse'

async function cargarDatosTemporada(temporada) {
  // Carga el archivo único de la carpeta temporadas
  const data = await fetch(`https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/temporadas/plantilla_${temporada}.json`).then(r => r.json());
  
  // Jugadores del Real Sociedad (tipo: 'jugador' o 'dual')
  jugadores = data.filter(ind => ind.tipo === 'jugador' || (ind.tipo === 'dual'));
  
  // Entrenadores del Real Sociedad (tipo: 'entrenador')
  entrenadores = data.filter(ind => ind.tipo === 'entrenador');
  
  // Salidas
  salidas = data.filter(ind => ind.tipo === 'salida');
  
  // Jugadores Sanse (tipo: 'sanse' o 'dual')
  sanseJugadores = data.filter(ind => ind.tipo === 'sanse' || (ind.tipo === 'dual')).sort((a, b) => a.dorsal2 - b.dorsal2);
  
  // Entrenadores Sanse (tipo: 'entrenador-sanse')
  sanseEntrenadores = data.filter(ind => ind.tipo === 'entrenador-sanse');
  
  // Mostrar/ocultar desplegable de equipo
  const equipoSelect = document.getElementById('equipoSelect');
  const equipoLabel = document.getElementById('equipoLabel');
  if (temporada === '2025-26') {
    equipoSelect.style.display = 'block';
    equipoLabel.style.display = 'block';
  } else {
    equipoSelect.style.display = 'none';
    equipoLabel.style.display = 'none';
  }
  
  renderPlayers();
  renderEntrenadores();
  renderVendidos();
  setupPlayButtons();
  setupEasterEgg();
}

// Llama a cargarDatosTemporada cuando cambie el selector de temporada
const temporadaSelect = document.getElementById('seasonSelect');
const equipoSelect = document.getElementById('equipoSelect');

if (temporadaSelect) {
  temporadaSelect.addEventListener('change', function() {
    currentTeam = 'real'; // Reset a Real Sociedad cuando cambias temporada
    if (equipoSelect) equipoSelect.value = 'real';
    cargarDatosTemporada(this.value);
  });
  // Cargar la temporada inicial
  cargarDatosTemporada(temporadaSelect.value);
} else {
  // Si no hay selector, cargar por defecto 2025
  cargarDatosTemporada('2025-26');
}

// Event listener para el desplegable de equipo
if (equipoSelect) {
  equipoSelect.addEventListener('change', function() {
    currentTeam = this.value;
    renderPlayers();
    renderEntrenadores();
    renderVendidos();
    setupPlayButtons();
    setupEasterEgg();
  });
}

    // Traducciones
    const translations = {
      es: {
        dorsal: 'Dorsal',
        menuOnce: 'Crear once',
        menuPlantilla: 'Plantilla',
        menuMerkatu: 'Simulación de mercado',
        plantillaTitle: 'En plantilla',
        porterosTitle: 'Porteros',
        defensasTitle: 'Defensas',
        centrocampistasTitle: 'Centrocampistas',
        delanterosTitle: 'Delanteros',
        entrenadoresTitle: 'Entrenadores',
        vendidosTitle: 'Vendidos/Cedidos',
        transferido: 'Transferido',
        cedido: 'Cedido',
        season: 'Temporada:',
        team: 'Equipo:'
      },
      eu: {
        dorsal: 'Dortsala',
        menuOnce: 'Hamaikakoa sortu',
        menuPlantilla: 'Taldea',
        menuMerkatu: 'Merkatu simulaketa',
        plantillaTitle: 'Taldekideak',
        porterosTitle: 'Atezainak',
        defensasTitle: 'Atzelariak',
        centrocampistasTitle: 'Erdilariak',
        delanterosTitle: 'Aurrelariak',
        entrenadoresTitle: 'Entrenatzaileak',
        vendidosTitle: 'Salduta/Utzita',
        transferido: 'Salduta',
        cedido: 'Utzita',
        season: 'Denboraldia:',
        team: 'Taldea:'
      }
    };
    let currentLang = localStorage.getItem('lang') || 'eu';

    function getFlagStyle(pais) {
      const noDeform = ['Nafarroa', 'Gipuzkoa', 'Bizkaia', 'Araba'];
      const base = 'vertical-align:middle; width:22px; height:16px; border-radius:2px; box-shadow:0 1px 2px rgba(0,0,0,0.10);';
      return noDeform.includes(pais) ? base + ' object-fit:contain;' : base;
    }

    function renderPlayers() {
  const posList = [
    { pos: 'POR', containerId: 'porterosContainer' },
    { pos: 'DEF', containerId: 'defensasContainer' },
    { pos: 'MED', containerId: 'centrocampistasContainer' },
    { pos: 'DEL', containerId: 'delanterosContainer' }
  ];
  const temporadaCarpeta = temporadaSelect && temporadaSelect.value ? temporadaSelect.value : '2025-26';
  const is202526 = temporadaSelect && temporadaSelect.value === '2025-26';
  const isSanse = currentTeam === 'sanse';
  const playersToRender = isSanse ? sanseJugadores : jugadores;
  
    posList.forEach(({ pos, containerId }) => {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    playersToRender.forEach((player, idx) => {
      if (player.pos !== pos) return;
      const card = document.createElement('div');
      card.className = 'player-card';
      
      // Usar dorsal2 si es Sanse, dorsal si es Real
      const dorsalDisplay = isSanse && player.dorsal2 ? player.dorsal2 : player.dorsal;
      
      card.innerHTML = `
        <img class="player-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/${temporadaCarpeta}/${player.url_name}.jpg" alt="${player.name}" data-easter-egg="${player.url_name}">
        <div class="player-info">
          <span class="player-name">
            <img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais}.png" alt="flag" style="${getFlagStyle(player.pais)} margin-right:2px;">
            ${player.pais2 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais2}.png" alt="flag2" style="${getFlagStyle(player.pais2)} margin-left:2px;">` : ''}
            ${player.pais3 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais3}.png" alt="flag3" style="${getFlagStyle(player.pais3)} margin-left:2px;">` : ''}
            ${player.pais4 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais4}.png" alt="flag4" style="${getFlagStyle(player.pais4)} margin-left:2px;">` : ''}
            ${player.name}
          </span>
          <span class="player-fullname">${player.fullname}</span>
          <span class="player-dorsal">${dorsalDisplay ? translations[currentLang].dorsal + ': ' + dorsalDisplay : ''}</span>
        </div>
        ${is202526 && !isSanse ? `<div style=\"display: flex; align-items: center; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); gap: 0;\">
          <button class=\"play-btn\" data-idx=\"${idx}\" style=\"margin-right: -20px;\">▶️</button>
          <div class=\"song-info-icon\" tabindex=\"0\" style=\"margin-left: -28px;\">ⓘ<span class=\"song-info-tooltip\"></span></div>
        </div>` : ''}
      `;
      // Tooltip explicación canción desde el JSON (solo si hay icono)
      const infoIcon = card.querySelector('.song-info-icon');
      if (infoIcon) {
        infoIcon.addEventListener('mouseenter', function() {
          const expl = player.cancion;
          if (expl && expl[currentLang]) {
            infoIcon.querySelector('.song-info-tooltip').textContent = expl[currentLang];
            infoIcon.querySelector('.song-info-tooltip').style.display = 'block';
          }
        });
        infoIcon.addEventListener('mouseleave', function() {
          infoIcon.querySelector('.song-info-tooltip').style.display = 'none';
        });
      }
      container.appendChild(card);
    });
  });
}

function renderEntrenadores() {
  const container = document.getElementById('entrenadoresContainer');
  container.innerHTML = '';
  const temporadaCarpeta = temporadaSelect && temporadaSelect.value ? temporadaSelect.value : '2025-26';
  const is202526 = temporadaSelect && temporadaSelect.value === '2025-26';
  const isSanse = currentTeam === 'sanse';
  const entrenadoresRender = isSanse ? sanseEntrenadores : entrenadores;
  
  entrenadoresRender.forEach((coach, idx) => {
    const card = document.createElement('div');
    card.className = 'player-card';
    
    // Para Sanse usar 'status', para Real Sociedad usar 'rol'
    const rol = isSanse ? coach.status[currentLang] : coach.rol[currentLang];
    
    card.innerHTML = `
      <img class="player-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/${temporadaCarpeta}/${coach.url_name}.jpg" alt="${coach.name}" data-easter-egg="${coach.url_name}">
      <div class="player-info">
        <span class="player-name">
          <img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${coach.pais}.png" alt="flag" style="${getFlagStyle(coach.pais)} margin-right:2px;">
          ${coach.pais2 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${coach.pais2}.png" alt="flag2" style="${getFlagStyle(coach.pais2)} margin-left:2px;">` : ''}
          ${coach.pais3 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${coach.pais3}.png" alt="flag3" style="${getFlagStyle(coach.pais3)} margin-left:2px;">` : ''}
          ${coach.pais4 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${coach.pais4}.png" alt="flag4" style="${getFlagStyle(coach.pais4)} margin-left:2px;">` : ''}
          ${coach.name}
        </span>
        <span class="player-fullname">${coach.fullname}</span>
        <span class="player-dorsal">${rol}</span>
      </div>
      ${is202526 && !isSanse ? `<div style=\"display: flex; align-items: center; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); gap: 0;\">
        <button class=\"play-btn\" data-idx=\"e${idx}\" style=\"margin-right: -20px;\">▶️</button>
        <div class=\"song-info-icon\" tabindex=\"0\" style=\"margin-left: -28px;\">ⓘ<span class=\"song-info-tooltip\"></span></div>
      </div>` : ''}
    `;
    const infoIcon = card.querySelector('.song-info-icon');
    if (infoIcon) {
      infoIcon.addEventListener('mouseenter', function() {
        const expl = coach.cancion;
        if (expl && expl[currentLang]) {
          infoIcon.querySelector('.song-info-tooltip').textContent = expl[currentLang];
          infoIcon.querySelector('.song-info-tooltip').style.display = 'block';
        }
      });
      infoIcon.addEventListener('mouseleave', function() {
        infoIcon.querySelector('.song-info-tooltip').style.display = 'none';
      });
    }
    container.appendChild(card);
  });
}

function renderVendidos() {
  const container = document.getElementById('vendidosContainer');
  const title = document.getElementById('vendidosTitle');
  const isSanse = currentTeam === 'sanse';
  
  // Ocultar la sección de salidas en modo Sanse
  if (isSanse) {
    container.style.display = 'none';
    title.style.display = 'none';
    return;
  }
  
  container.style.display = 'block';
  title.style.display = 'block';
  container.innerHTML = '';
  const temporadaCarpeta = temporadaSelect && temporadaSelect.value ? temporadaSelect.value : '2025-26';
  const is202526 = temporadaSelect && temporadaSelect.value === '2025-26';
  salidas.forEach((player, idx) => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `
      <img class="player-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/${temporadaCarpeta}/${player.url_name}.jpg" alt="${player.name}" data-easter-egg="${player.url_name}">
      <div class="player-info">
        <span class="player-name">
          <img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais}.png" alt="flag" style="${getFlagStyle(player.pais)} margin-right:2px;">
          ${player.pais2 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais2}.png" alt="flag2" style="${getFlagStyle(player.pais2)} margin-left:2px;">` : ''}
            ${player.pais3 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais3}.png" alt="flag3" style="${getFlagStyle(player.pais3)} margin-left:2px;">` : ''}
            ${player.pais4 ? `<img src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/banderak/${player.pais4}.png" alt="flag4" style="${getFlagStyle(player.pais4)} margin-left:2px;">` : ''}
            ${player.name}
        </span>
        <span class="player-fullname">${player.fullname}</span>
        <span class="player-dorsal">${player.status[currentLang]}</span>
      </div>
      ${is202526 ? `<div style=\"display: flex; align-items: center; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); gap: 0;\">
        <button class=\"play-btn\" data-idx=\"v${idx}\" style=\"margin-right: -20px;\">▶️</button>
        <div class=\"song-info-icon\" tabindex=\"0\" style=\"margin-left: -28px;\">ⓘ<span class=\"song-info-tooltip\"></span></div>
      </div>` : ''}
    `;
    const infoIcon = card.querySelector('.song-info-icon');
    if (infoIcon) {
      infoIcon.addEventListener('mouseenter', function() {
        const expl = player.cancion;
        if (expl && expl[currentLang]) {
          infoIcon.querySelector('.song-info-tooltip').textContent = expl[currentLang];
          infoIcon.querySelector('.song-info-tooltip').style.display = 'block';
        }
      });
      infoIcon.addEventListener('mouseleave', function() {
        infoIcon.querySelector('.song-info-tooltip').style.display = 'none';
      });
    }
    container.appendChild(card);
  });
}
// Reproductor global
    let currentAudio = null;
    let currentBtn = null;
    let audioPositions = {};
    function getSongUrl(player, isVendido) {
      if (!player.url_name) return null;
      return `https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/mp3/${player.url_name}.mp3`;
    }
    
    function setupEasterEgg() {
      document.querySelectorAll('[data-easter-egg="imanol_alguacil"]').forEach(img => {
        img.style.cursor = 'pointer';
        img.addEventListener('click', function(e) {
          e.stopPropagation();
          playEasterEggAudio();
        });
      });
    }
    
    function playEasterEggAudio() {
      if (currentAudio) {
        currentAudio.pause();
        if (currentBtn) currentBtn.textContent = '▶️';
      }
      currentAudio = new Audio('https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/mp3/erreala-ale.mp3');
      currentBtn = null;
      currentAudio.play();
      currentAudio.onended = function() {
        currentAudio = null;
        currentBtn = null;
      };
      currentAudio.onpause = function() {
        currentAudio = null;
        currentBtn = null;
      };
    }
    function setupPlayButtons() {
      document.querySelectorAll('.play-btn').forEach(btn => {
        btn.onclick = function() {
          let idx = btn.getAttribute('data-idx');
          let player, isVendido = false, isEntrenador = false;
            if (idx.startsWith('v')) {
              player = salidas[parseInt(idx.slice(1))];
              isVendido = true;
            } else if (idx.startsWith('e')) {
              player = entrenadores[parseInt(idx.slice(1))];
              isEntrenador = true;
            } else {
              player = jugadores[parseInt(idx)];
          }
          let url = getSongUrl(player, isVendido || isEntrenador);
          if (!url) return;
          // Si ya está sonando este audio, pausar/reanudar
          if (currentAudio && currentAudio.src === url) {
            if (currentAudio.paused) {
              currentAudio.play();
              btn.textContent = '⏹️';
            } else {
              currentAudio.pause();
              btn.textContent = '▶️';
            }
            return;
          }
          // Parar el anterior
          if (currentAudio) {
            currentAudio.pause();
            if (currentBtn) currentBtn.textContent = '▶️';
          }
          // Crear nuevo audio
          if (!audioPositions[url]) audioPositions[url] = 0;
          currentAudio = new Audio(url);
          currentAudio.currentTime = audioPositions[url];
          currentBtn = btn;
          btn.textContent = '⏹️';
          currentAudio.play();
          currentAudio.onended = function() {
            btn.textContent = '▶️';
            audioPositions[url] = 0;
            currentAudio = null;
            currentBtn = null;
          };
          currentAudio.onpause = function() {
            audioPositions[url] = currentAudio.currentTime;
            btn.textContent = '▶️';
          };
        };
      });
    }
    
    function updateLangBtn() {
  // Actualizar menú lateral
  document.getElementById('menu-once').textContent = translations[currentLang].menuOnce;
  document.getElementById('menu-plantilla').textContent = translations[currentLang].menuPlantilla;
  document.getElementById('menu-merkatu').textContent = translations[currentLang].menuMerkatu;
  // Actualizar títulos
  document.getElementById('plantillaTitle').textContent = translations[currentLang].plantillaTitle;
  document.getElementById('vendidosTitle').textContent = translations[currentLang].vendidosTitle;
  document.getElementById('porterosTitle').textContent = translations[currentLang].porterosTitle;
  document.getElementById('defensasTitle').textContent = translations[currentLang].defensasTitle;
  document.getElementById('centrocampistasTitle').textContent = translations[currentLang].centrocampistasTitle;
  document.getElementById('delanterosTitle').textContent = translations[currentLang].delanterosTitle;
  document.getElementById('entrenadoresTitle').textContent = translations[currentLang].entrenadoresTitle;
  // Actualizar botón idioma
  document.getElementById('langBtn').textContent = currentLang === 'es' ? 'Eus' : 'Cast';
  // Cambiar label temporada
  if (document.getElementById('seasonLabel')) {
    document.getElementById('seasonLabel').textContent = translations[currentLang].season;
  }
  // Cambiar label equipo
  if (document.getElementById('equipoLabel')) {
    document.getElementById('equipoLabel').textContent = translations[currentLang].team;
  }
  renderPlayers();
  renderEntrenadores();
  renderVendidos();
  setupPlayButtons();
  setupEasterEgg();
}
    document.getElementById('langBtn').onclick = function() {
  currentLang = currentLang === 'es' ? 'eu' : 'es';
  localStorage.setItem('lang', currentLang); // Guardar idioma
  updateLangBtn();
    };
    updateLangBtn();
  </script>
