<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Traducciones para el menú lateral
    const menuTranslations = {
      es: { plantilla: 'Plantilla', once: 'Crear once' },
      eu: { plantilla: 'Taldea', once: 'Hamaikakoa sortu'}
    };
    let menuLang = 'es';
    // Leer idioma guardado en localStorage si existe
    if (localStorage.getItem('lang')) {
      menuLang = localStorage.getItem('lang');
    }
    function updateMenuLang() {
      document.getElementById('menu-once').textContent = menuTranslations[menuLang].once;
      document.getElementById('menu-plantilla').textContent = menuTranslations[menuLang].plantilla;
      document.getElementById('langBtn').textContent = menuLang === 'es' ? 'Eus' : 'Cast';
    }
    document.addEventListener('DOMContentLoaded', updateMenuLang);
  </script>
  <meta charset="UTF-8">
  <title>Real Sociedad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #003366; margin: 0; padding: 0; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 210px;
      height: 100vh;
      background: #002244;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 48px;
      z-index: 100;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }
    .sidebar a {
      color: #fff;
      text-decoration: none;
      font-size: 1.2em;
      font-weight: bold;
      padding: 16px 32px;
      width: 100%;
      display: block;
      border-left: 4px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar a.active, .sidebar a:hover {
      background: #003366;
      border-left: 4px solid #0077cc;
    }
    .main-content {
      margin-left: 210px;
      padding: 32px 0 0 0;
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      justify-items: start; /* Cambia 'center' por 'start' */
      margin-left: 40px;    /* Igual que el margen de los títulos */
    }
    .player-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
  gap: 32px;
  padding: 18px 32px 18px 32px;
  margin-bottom: 0;
  width: 100%;
  max-width: 390px;
  min-height: 110px;
    }
    .player-img {
    /* Estilo para el botón de play/stop */
    .play-btn {
      background: #fff;
      color: #003366;
      border: none;
      border-radius: 16px;
      padding: 12px 24px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      font-size: 1.3em;
      margin-left: 32px;
    }
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0077cc;
      background: #eee;
    }
    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-name {
      font-size: 1.2em;
      font-weight: bold;
      color: #003366;
    }
    .player-fullname {
      font-size: 1em;
      color: #222;
      font-weight: normal;
    }
    .player-dorsal {
      font-size: 1.1em;
      color: #0077cc;
      font-weight: bold;
      margin-bottom: 2px;
    }
    @media (max-width: 900px) {
      .sidebar { width: 56px; padding-top: 24px; }
      .sidebar a { font-size: 1em; padding: 12px 8px; }
      .main-content { margin-left: 56px; }
      .player-card { padding: 12px 8px; gap: 12px; }
      .player-img { width: 48px; height: 48px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="plantilla.html" id="menu-plantilla" class="active">Plantilla</a>
    <a href="hamaikakoa.html" id="menu-once">Crear once</a>
  </div>
  <div class="main-content">
  <h2 id="plantillaTitle" style="color:#fff; font-weight:bold; margin-left:32px; margin-bottom:0px;"></h2>
  <h2 id="porterosTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
  <div class="players-grid" id="porterosContainer"></div>
  <h2 id="defensasTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
  <div class="players-grid" id="defensasContainer"></div>
  <h2 id="centrocampistasTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
  <div class="players-grid" id="centrocampistasContainer"></div>
  <h2 id="delanterosTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
  <div class="players-grid" id="delanterosContainer"></div>
  <h2 id="vendidosTitle" style="color:#fff; font-weight:bold; margin-left:32px; margin-top:56px; margin-bottom:40px;"></h2>
  <div class="players-grid" id="vendidosContainer"></div>
  <button id="langBtn" style="background:#fff; color:#003366; border-radius:8px; border:none; font-weight:bold; font-size:1em; padding:6px 18px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.12); position:fixed; top:18px; right:24px; z-index:200;">Eus</button>
  </div>
  <script>
    // Jugadores en plantilla
    const players = [
  { dorsal: 1, name: 'A. Remiro', fullname: 'Álex Remiro', url_name: 'alex_remiro', pos: 'POR' },
  { dorsal: 2, name: 'Aramburu', fullname: 'Jon Mikel Aramburu', url_name: 'jon_mikel_aramburu', pos: 'DEF' },
  { dorsal: 3, name: 'Aihen', fullname: 'Aihen Muñoz', url_name: 'aihen_munoz', pos: 'DEF' },
  { dorsal: 4, name: 'Gorrotxa', fullname: 'Jon Gorrotxategi', url_name: 'jon_gorrotxategi', pos: 'MED' },
  { dorsal: 5, name: 'Zubeldia', fullname: 'Igor Zubeldia', url_name: 'igor_zubeldia', pos: 'DEF' },
  { dorsal: 6, name: 'Aritz', fullname: 'Aritz Elustondo', url_name: 'aritz_elustondo', pos: 'DEF' },
  { dorsal: 7, name: 'Barrene', fullname: 'Ander Barrenetxea', url_name: 'ander_barrenetxea', pos: 'DEL' },
  { dorsal: 8, name: 'Turrientes', fullname: 'Beñat Turrientes', url_name: 'benat_turrientes', pos: 'MED' },
  { dorsal: 9, name: 'Óskarsson', fullname: 'Orri Óskarsson', url_name: 'orri_oskarsson', pos: 'DEL' },
  { dorsal: 10, name: 'Oyarzabal', fullname: 'Mikel Oyarzabal', url_name: 'mikel_oyarzabal', pos: 'DEL' },
  { dorsal: 11, name: 'Guedes', fullname: 'Gonçalo Guedes', url_name: 'goncalo_guedes', pos: 'DEL' },
  { dorsal: 12, name: 'Herrera', fullname: 'Yangel Herrera', url_name: 'yangel_herrera', pos: 'MED' },
  { dorsal: 13, name: 'Marrero', fullname: 'Unai Marrero', url_name: 'unai_marrero', pos: 'POR' },
  { dorsal: 14, name: 'Take', fullname: 'Takefusa Kubo', url_name: 'takefusa_kubo', pos: 'DEL' },
  { dorsal: 16, name: 'Ćaleta-Car', fullname: 'Duje Ćaleta-Car', url_name: 'duje_caletacar', pos: 'DEF' },
  { dorsal: 17, name: 'Sergio Gómez', fullname: 'Sergio Gómez', url_name: 'sergio_gomez', pos: 'DEF' },
  { dorsal: 18, name: 'C. Soler', fullname: 'Carlos Soler', url_name: 'carlos_soler', pos: 'MED' },
  { dorsal: 19, name: 'Karrikaburu', fullname: 'Jon Karrikaburu', url_name: 'jon_karrikaburu', pos: 'DEL' },
  { dorsal: 21, name: 'Zakharyan', fullname: 'Arsen Zakharyan', url_name: 'arsen_zakharyan', pos: 'MED' },
  { dorsal: 22, name: 'Goti', fullname: 'Mikel Goti', url_name: 'mikel_goti', pos: 'MED' },
  { dorsal: 23, name: 'Brais Méndez', fullname: 'Brais Méndez', url_name: 'brais_mendez', pos: 'MED' },
  { dorsal: 24, name: 'Sučić', fullname: 'Luka Sučić', url_name: 'luka_sucic', pos: 'MED' },
  { dorsal: 28, name: 'Marín', fullname: 'Pablo Marín', url_name: 'pablo_marin', pos: 'MED' },
  { dorsal: 31, name: 'Jon Martín', fullname: 'Jon Martín', url_name: 'jon_martin', pos: 'DEF' },
  { dorsal: 32, name: 'Fraga', fullname: 'Aitor Fraga', url_name: 'aitor_fraga', pos: 'POR' },
  { dorsal: 33, name: 'Rupérez', fullname: 'Iñaki Rupérez', url_name: 'inaki_ruperez', pos: 'DEF' },
  { dorsal: 40, name: 'Mariezkurrena', fullname: 'Arkaitz Mariezkurrena', url_name: 'arkaitz_mariezkurrena', pos: 'DEL' },
  { dorsal: '', name: 'Odriozola', fullname: 'Álvaro Odriozola', url_name: 'alvaro_odriozola', pos: 'DEF' },
  { dorsal: '', name: 'Sadiq', fullname: 'Sadiq Umar', url_name: 'sadiq_umar', pos: 'DEL' }
    ];
    // Jugadores vendidos/cedidos
    const vendidos = [
  { name: 'Javi López', fullname: 'Javi López', status: { es: 'Cedido', eu: 'Utzita' }, url_name: 'javi_lopez' },
  { name: 'Pacheco', fullname: 'Jon Pacheco', status: { es: 'Cedido', eu: 'Utzita' }, url_name: 'jon_pacheco' },
  { name: 'Carlos Fdez.', fullname: 'Carlos Fernández', status: { es: 'Cedido', eu: 'Utzita' }, url_name: 'carlos_fernandez' },
  { name: 'Becker', fullname: 'Sheraldo Becker', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'sheraldo_becker' },
  { name: 'H. Traoré', fullname: 'Hamari Traoré', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'hamari_traore' },
  { name: 'Urko', fullname: 'Urko González de Zárate', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'urko_gonzalez_de_zarate' },
  { name: 'Olasagasti', fullname: 'Jon Ander Olasagasti', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'jon_ander_olasagasti' },
  { name: 'Zubimendi', fullname: 'Martin Zubimendi', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'martin_zubimendi' },
  { name: 'Magunazelaia', fullname: 'Jon Magunazelaia', status: { es: 'Transferido', eu: 'Salduta' }, url_name: 'jon_magunazelaia' }
    ];
    // Traducciones
    const translations = {
      es: {
        dorsal: 'Dorsal',
        menuOnce: 'Crear once',
        menuPlantilla: 'Plantilla',
        plantillaTitle: 'En plantilla',
        porterosTitle: 'Porteros',
        defensasTitle: 'Defensas',
        centrocampistasTitle: 'Centrocampistas',
        delanterosTitle: 'Delanteros',
        vendidosTitle: 'Vendidos/Cedidos',
        transferido: 'Transferido',
        cedido: 'Cedido'
      },
      eu: {
        dorsal: 'Dortsala',
        menuOnce: 'Hamaikakoa sortu',
        menuPlantilla: 'Taldea',
        plantillaTitle: 'Taldekideak',
        porterosTitle: 'Atezainak',
        defensasTitle: 'Atzelariak',
        centrocampistasTitle: 'Erdilariak',
        delanterosTitle: 'Aurrelariak',
        vendidosTitle: 'Salduta/Utzita',
        transferido: 'Salduta',
        cedido: 'Utzita'
      }
    };
    let currentLang = localStorage.getItem('lang') || 'es';
    function renderPlayers() {
  const posList = [
    { pos: 'POR', containerId: 'porterosContainer' },
    { pos: 'DEF', containerId: 'defensasContainer' },
    { pos: 'MED', containerId: 'centrocampistasContainer' },
    { pos: 'DEL', containerId: 'delanterosContainer' }
  ];
  posList.forEach(({ pos, containerId }) => {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    players.forEach((player, idx) => {
      if (player.pos !== pos) return;
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `
        <img class="player-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/${player.url_name}.jpg" alt="${player.name}">
        <div class="player-info">
          <span class="player-name">${player.name}</span>
          <span class="player-fullname">${player.fullname}</span>
          <span class="player-dorsal">${player.dorsal ? translations[currentLang].dorsal + ': ' + player.dorsal : ''}</span>
        </div>
        <button class="play-btn" data-idx="${idx}">▶️</button>
      `;
      container.appendChild(card);
    });
  });
}
    
    function renderVendidos() {
      const container = document.getElementById('vendidosContainer');
      container.innerHTML = '';
      vendidos.forEach((player, idx) => {
        const card = document.createElement('div');
        card.className = 'player-card';
        card.innerHTML = `
          <img class="player-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/${player.url_name}.jpg" alt="${player.name}">
          <div class="player-info">
            <span class="player-name">${player.name}</span>
            <span class="player-fullname">${player.fullname}</span>
            <span class="player-dorsal">${player.status[currentLang]}</span>
          </div>
          <button class="play-btn" data-idx="v${idx}">▶️</button>
        `;
        container.appendChild(card);
      });
    }
    // Reproductor global
    let currentAudio = null;
    let currentBtn = null;
    let audioPositions = {};
    function getSongUrl(player, isVendido) {
      if (!player.url_name) return null;
      return `https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/mp3/${player.url_name}.mp3`;
    }
    function setupPlayButtons() {
      document.querySelectorAll('.play-btn').forEach(btn => {
        btn.onclick = function() {
          let idx = btn.getAttribute('data-idx');
          let player, isVendido = false;
          if (idx.startsWith('v')) {
            player = vendidos[parseInt(idx.slice(1))];
            isVendido = true;
          } else {
            player = players[parseInt(idx)];
          }
          let url = getSongUrl(player, isVendido);
          if (!url) return;
          // Si ya está sonando este audio, pausar/reanudar
          if (currentAudio && currentAudio.src === url) {
            if (currentAudio.paused) {
              currentAudio.play();
              btn.textContent = '⏹️';
            } else {
              currentAudio.pause();
              btn.textContent = '▶️';
            }
            return;
          }
          // Parar el anterior
          if (currentAudio) {
            currentAudio.pause();
            if (currentBtn) currentBtn.textContent = '▶️';
          }
          // Crear nuevo audio
          if (!audioPositions[url]) audioPositions[url] = 0;
          currentAudio = new Audio(url);
          currentAudio.currentTime = audioPositions[url];
          currentBtn = btn;
          btn.textContent = '⏹️';
          currentAudio.play();
          currentAudio.onended = function() {
            btn.textContent = '▶️';
            audioPositions[url] = 0;
            currentAudio = null;
            currentBtn = null;
          };
          currentAudio.onpause = function() {
            audioPositions[url] = currentAudio.currentTime;
            btn.textContent = '▶️';
          };
        };
      });
    }
    
    function updateLangBtn() {
  // Actualizar menú lateral
  document.getElementById('menu-once').textContent = translations[currentLang].menuOnce;
  document.getElementById('menu-plantilla').textContent = translations[currentLang].menuPlantilla;
  // Actualizar títulos
  document.getElementById('plantillaTitle').textContent = translations[currentLang].plantillaTitle;
  document.getElementById('vendidosTitle').textContent = translations[currentLang].vendidosTitle;
  document.getElementById('porterosTitle').textContent = translations[currentLang].porterosTitle;
  document.getElementById('defensasTitle').textContent = translations[currentLang].defensasTitle;
  document.getElementById('centrocampistasTitle').textContent = translations[currentLang].centrocampistasTitle;
  document.getElementById('delanterosTitle').textContent = translations[currentLang].delanterosTitle;
  // Actualizar botón idioma
  document.getElementById('langBtn').textContent = currentLang === 'es' ? 'Eus' : 'Cast';
  renderPlayers();
  renderVendidos();
  setupPlayButtons();
}
    document.getElementById('langBtn').onclick = function() {
  currentLang = currentLang === 'es' ? 'eu' : 'es';
  localStorage.setItem('lang', currentLang); // Guardar idioma
  updateLangBtn();
  document.addEventListener('DOMContentLoaded', updateLangBtn);
    };
    updateLangBtn();
  </script>
</body>
</html>
