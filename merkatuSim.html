<!DOCTYPE html>
<html lang="eus">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/other/favicon.ico" type="image/x-icon">
  <title>Real Sociedad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/merkatuSim.css">
  <!-- i18next -->
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/dist/umd/i18next.min.js"></script>
  <script src="src/i18n-config.js"></script>
</head>
<body>
  <div class="sidebar">
    <a href="plantilla.html" id="menu-plantilla">Plantilla</a>
    <a href="hamaikakoa.html" id="menu-once">Hamaikakoa</a>
    <a href="merkatuSim.html" id="menu-merkatu" class="active">Merkatu simulaketa</a>
    <button id="langBtn" style="background:#fff; color:#003366; border-radius:8px; border:none; font-weight:bold; font-size:1em; padding:6px 18px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.12); margin-top:auto; margin-left:32px; margin-right:32px; margin-bottom:24px;">Eus</button>
  </div>
  <div class="sidebar-overlay"></div>
  <button id="toggleSidebar" style="display:none;">☰</button>
  <div class="main-content">
    <div style="display:flex; align-items:center; gap:16px; margin: 7px 0 0 32px;">
      <label for="equipoSelect" id="equipoLabel" style="color:#fff; font-weight:bold; font-size:1.1em;">Equipo:</label>
      <select id="equipoSelect" style="font-size:1em; border-radius:6px; padding:4px 12px;">
        <option value="real" selected>Real Sociedad</option>
        <option value="f">Real Sociedad F</option>
        <option value="sanse">Sanse</option>
      </select>
    </div>
    <h1 id="pageTitle" style="color:#fff; font-weight:bold; margin-top:20px; margin-left:32px; margin-bottom:0; display:none;"></h1>
    
    <!-- Botones de pantalla -->
    <div style="display:flex; gap:16px; margin-left:32px; margin-top:16px; margin-bottom:16px;">
      <button id="screenBtn1" class="screen-tab-btn active" onclick="switchMerkatuScreen(1)" style="background:#0077cc; color:#fff; border-radius:8px; border:none; font-weight:bold; padding:8px 16px; cursor:pointer; transition:background 0.3s;">Gestionar Plantilla</button>
      <button id="screenBtn2" class="screen-tab-btn" onclick="switchMerkatuScreen(2)" style="background:#666; color:#fff; border-radius:8px; border:none; font-weight:bold; padding:8px 16px; cursor:pointer; transition:background 0.3s;">Once en el Campo</button>
    </div>
    
    <!-- PANTALLA 1: GESTIONAR PLANTILLA -->
    <div id="screen1" class="active">
      <button id="resetBtn" style="background:#e74c3c; color:#fff; border-radius:8px; border:none; font-weight:bold; font-size:0.85em; padding:6px 14px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.12); margin-left:32px; margin-top:12px; margin-bottom:24px;">Deshacer cambios</button>
      <h2 id="porterosTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
      <div class="players-grid" id="porterosContainer"></div>
      <h2 id="defensasTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
      <div class="players-grid" id="defensasContainer"></div>
      <h2 id="centrocampistasTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
      <div class="players-grid" id="centrocampistasContainer"></div>
      <h2 id="delanterosTitle" style="color:#fff; font-weight:bold; font-size:1.5em; margin-left:40px; margin-top:20px; margin-bottom:10px;"></h2>
      <div class="players-grid" id="delanterosContainer"></div>
      <h2 id="salidasTitle" style="color:#fff; font-weight:bold; margin-left:32px; margin-top:56px; margin-bottom:40px;"></h2>
      <div class="players-grid" id="salidasContainer"></div>
    </div>
    
    <!-- PANTALLA 2: ONCE EN EL CAMPO -->
    <div id="screen2">
      <!-- Opciones: formación, filtro, marca de agua -->
      <div id="optionsBlock2" class="d-flex flex-wrap align-items-center justify-content-center gap-4 mb-4" style="margin-top:32px;">
        <div class="d-flex align-items-center flex-wrap justify-content-center" style="margin-bottom:20px;">
          <label id="formationLabel2" class="form-label mb-0 me-2" style="color:#fff; font-size:1.2em; font-weight:bold;">
            <span id="formationText2">Formación:</span>
          </label>
          <select id="formationSelect2" class="form-select w-auto" style="font-size:1em; padding:4px 12px; border-radius:6px; border:none; min-width:120px; max-width:120px;">
            <option value="4-2-3-1">4-2-3-1</option>
            <option value="4-3-3">4-3-3</option>
            <option value="4-4-2 (1)">4-4-2 (1)</option>
            <option value="4-4-2 (2)">4-4-2 (2)</option>
            <option value="3-4-1-2">3-4-1-2</option>
            <option value="5-3-2">5-3-2</option>
            <option value="5-2-3">5-2-3</option>
            <option value="5-1-3-1">5-1-3-1</option>
            <option value="4-5-1">4-5-1</option>
            <option value="4-2-1-2-1">4-2-1-2-1</option>
            <option value="4-1-2-2-1">4-1-2-2-1</option>
          </select>
        </div>
        <div class="d-flex align-items-center flex-wrap justify-content-center" style="margin-bottom:20px;">
          <input type="checkbox" id="filterByPosition2" checked class="form-check-input me-2" style="transform:scale(1.3); vertical-align:middle;">
          <label id="filterLabel2" for="filterByPosition2" class="form-label mb-0" style="color:#fff; font-size:1.2em; font-weight:bold;">
            <span id="filterText2">Filtrar jugadores por posición</span>
          </label>
        </div>
        <div class="d-flex align-items-center flex-wrap justify-content-center" style="margin-bottom:20px;">
          <input type="checkbox" id="watermarkToggle2" class="form-check-input me-2" style="transform:scale(1.3); vertical-align:middle;">
          <label id="watermarkLabel2" for="watermarkToggle2" class="form-label mb-0" style="color:#fff; font-size:1.2em; font-weight:bold;">
            <span id="watermarkText2">Marca de agua</span>
          </label>
        </div>
      </div>
      
      <div class="field-container" style="margin-top:32px;">
        <img class="field-img" src="https://raw.githubusercontent.com/OriyokoIjitua/TwReal/main/img/other/Zelaia2.jpg" alt="Zelaia">
        <!-- Posiciones de jugadores -->
        <div id="positions2"></div>
      </div>
      
      <!-- Botones de descargar y limpiar -->
      <div style="text-align:center; margin-bottom:32px;">
        <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
          <button id="downloadBtn2" class="btn btn-primary" style="min-width:170px; font-size:1.4em;"></button>
          <button id="clearBtn2" class="btn btn-primary" style="min-width:170px; font-size:1.4em;"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addPlayerModal">
    <div class="modal-content">
      <h3 class="modal-title" id="modalTitle"></h3>
      <div id="modalTabsContainer"></div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-secondary" id="addPlayerCloseBtn" onclick="closeAddPlayerModal()"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="dorsalModal">
    <div class="modal-content">
      <h3 class="modal-title" id="dorsalTitle"></h3>
      <div class="modal-section">
        <input type="number" class="modal-input" id="dorsalInput" placeholder="0-99" min="0" max="99">
      </div>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-secondary" id="dorsalCancelBtn" onclick="closeDorsalModal()"></button>
        <button class="modal-btn modal-btn-primary" id="dorsalSaveBtn" onclick="saveDorsal()"></button>
      </div>
    </div>
  </div>

  <!-- Modal para seleccionar jugadores en pantalla 2 -->
  <div class="player-list-modal" id="playerListModal2">
    <div class="player-list-box">
      <h3></h3>
      <div id="playerList2"></div>
      <button class="close-modal-btn" onclick="closePlayerList2()">Cerrar</button>
    </div>
  </div>

  <script src="src/merkatuSim.js"></script>
  <script src="src/sidebar-mobile.js"></script>
</body>
</html>
